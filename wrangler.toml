name = "roam402"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain (provisioned automatically on `wrangler deploy` ONCE the
# roam402.com zone exists in this Cloudflare account — RUNBOOK P1 step 0).
routes = [
  { pattern = "roam402.com", custom_domain = true }
]

# ── Environment ───────────────────────────────────────────────────────────────
# NETWORK selects every chain constant in src/config.ts. Ship testnet by
# default; the mainnet cutover is a single var flip + payTo change (see
# docs/RUNBOOK.md). The payTo address is PERMANENT for the whole competition —
# the leaderboard attributes the merchant by it.
#
# Secrets (never in this file, set via `wrangler secret put`):
#   BASE_WALLET_PRIVATE_KEY — hot wallet that pays origin services on Base.
[vars]
NETWORK = "testnet"
PAY_TO_ADDRESS = ""                       # set after account creation (RUNBOOK step 1)
FACILITATOR_URL = "https://facilitator.goplausible.xyz"
KILL_SWITCH = "off"                       # "on" → every paid route returns 503
PER_REQUEST_CAP_USD = "1.00"              # refuse origin spends above this
PUBLIC_BASE_URL = "https://roam402.com"   # advertised in every 402's extra.catalog (.dev.vars overrides locally)

# ── Receipts log (optional, recommended before mainnet) ──────────────────────
# wrangler kv namespace create RECEIPTS   → paste the id below, uncomment.
# [[kv_namespaces]]
# binding = "RECEIPTS"
# id = "<paste-id>"

# ── Self-healing catalog (enable with the KV binding above at deploy) ────────
# Probes every origin unpaid every 30 min; "down" routes refuse before payment.
# [triggers]
# crons = ["*/30 * * * *"]
# PUBLIC_BASE_URL: set to the real https://<domain> at deploy — advertised
# in every 402's extra.catalog so any touched route reveals the full index.
