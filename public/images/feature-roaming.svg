<svg width="560" height="360" viewBox="0 0 560 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <linearGradient id="fr-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fr-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Algorand hub -->
  <circle cx="96" cy="180" r="58" fill="url(#fr-g)" opacity="0.22" filter="url(#fr-soft)"/>
  <circle cx="96" cy="180" r="42" fill="url(#fr-g)"/>
  <path d="M104.9 164h5.5l2.4 8.9h5.7l-3.9 6.8 5.4 20.3h-5.6l-3.7-13.6-7.9 13.6h-6.3l12.2-21.1-2-7.3-16.4 28.4h-6.3Z" fill="#fff" transform="translate(-20 -16) scale(0.98)"/>
  <text x="96" y="248" text-anchor="middle" font-size="10" letter-spacing="2" fill="#71768d">ALGORAND</text>
  <rect x="56" y="98" width="80" height="22" rx="11" fill="#ecfdf3" stroke="#c3f0dc"/>
  <text x="96" y="113" text-anchor="middle" font-size="10" fill="#059669">USDC in</text>

  <!-- gateway -->
  <rect x="234" y="146" width="102" height="68" rx="16" fill="#ffffff"/>
  <rect x="233" y="145" width="104" height="70" rx="17" stroke="#cfd2fc" stroke-width="2"/>
  <circle cx="256" cy="180" r="5" fill="url(#fr-g)"/>
  <text x="270" y="184" font-size="12" fill="#181a26">roam402</text>

  <!-- rails -->
  <path d="M140 180 H232" stroke="url(#fr-g)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M338 168 C 386 150, 396 116, 428 106" stroke="url(#fr-g)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M338 180 H 428" stroke="url(#fr-g)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <path d="M338 192 C 386 210, 396 244, 428 254" stroke="url(#fr-g)" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <!-- origin chains -->
  <g>
    <rect x="428" y="84" width="96" height="44" rx="12" fill="#ffffff"/>
    <rect x="427" y="83" width="98" height="46" rx="13" stroke="#e2e5ee" stroke-width="2"/>
    <circle cx="448" cy="106" r="7" fill="#0052FF"/>
    <rect x="441" y="103.5" width="7" height="5" fill="#ffffff"/>
    <text x="462" y="110" font-size="11" fill="#3b3f52">Base</text>
  </g>
  <g>
    <rect x="428" y="158" width="96" height="44" rx="12" fill="#ffffff"/>
    <rect x="427" y="157" width="98" height="46" rx="13" stroke="#e2e5ee" stroke-width="2"/>
    <g transform="translate(441 174)">
      <path d="M2 0h11l-2 2.6H0Z" fill="#9945FF"/>
      <path d="M2 5h11l-2 2.6H0Z" fill="#7C7CFF"/>
      <path d="M2 10h11l-2 2.6H0Z" fill="#14B8A6"/>
    </g>
    <text x="462" y="184" font-size="11" fill="#3b3f52">Solana</text>
  </g>
  <g>
    <rect x="428" y="232" width="110" height="44" rx="12" fill="#ffffff"/>
    <rect x="427" y="231" width="112" height="46" rx="13" stroke="#e2e5ee" stroke-width="2"/>
    <path d="M448 240l-6.5 10.9 6.5 3.9 6.5-3.9Zm-6.5 12.2 6.5 9.2 6.5-9.2-6.5 3.8Z" fill="#627EEA"/>
    <text x="462" y="258" font-size="11" fill="#3b3f52">Ethereum</text>
  </g>

  <text x="234" y="248" font-size="10" fill="#969bb0">fulfilled from treasury</text>
  <path d="M234 258 H336" stroke="#e6e8f2" stroke-width="3"/>
</svg>
