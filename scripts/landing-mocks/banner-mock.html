<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#f4f5fb;color:#0d0e15;
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
  .ring{position:absolute;border:1.5px dashed rgba(13,14,21,.14);border-radius:50%}
  .glow{position:absolute;pointer-events:none}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
  .brand{display:flex;align-items:center;gap:18px;margin-bottom:34px}
  .brand img{width:64px;height:64px;border-radius:16px}
  .brand .w{font-size:40px;font-weight:650;letter-spacing:-.02em}
  .brand .w em{font-style:normal;color:#4f46e5}
  h1{font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.025em;max-width:840px;color:#0d0e15}
  h1 em{font-style:normal;background:linear-gradient(92deg,#6366f1,#4338ca);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:23px;color:#585d75;font-weight:400}
  .chips{display:flex;gap:14px;margin-top:38px}
  .chip{font-family:ui-monospace,Menlo,monospace;font-size:16px;color:#3b3f52;border:1px solid #e2e5ee;background:#ffffff;border-radius:999px;padding:10px 20px;box-shadow:0 1px 2px rgba(13,14,21,.04)}
  .chip.g{color:#059669;border-color:#c3f0dc;background:#ecfdf3}
  .by{position:absolute;bottom:44px;left:96px;font-size:17px;color:#969bb0}
  .by b{color:#585d75;font-weight:500}
  .sat{position:absolute;border-radius:50%;background:#4f46e5}
</style>
</head>
<body>
  <div class="glow" style="top:-320px;right:-160px;width:820px;height:820px;background:radial-gradient(closest-side,rgba(99,102,241,.2),transparent 70%)"></div>

  <div class="ring" style="width:760px;height:760px;top:-170px;right:-260px"></div>
  <div class="ring" style="width:560px;height:560px;top:-70px;right:-160px"></div>
  <div class="ring" style="width:360px;height:360px;top:30px;right:-60px"></div>
  <div class="sat" style="width:14px;height:14px;top:96px;right:214px;box-shadow:0 0 18px rgba(79,70,229,.55)"></div>
  <div class="sat" style="width:9px;height:9px;top:330px;right:56px;opacity:.6"></div>
  <div class="sat" style="width:7px;height:7px;top:22px;right:470px;opacity:.4"></div>
  <div class="wrap">
    <div class="brand"><img src="file:///Users/kaleab/Documents/roam402/public/icons/roam402.svg" alt=""/><div class="w">roam<em>402</em></div></div>
    <h1>Every x402 service,<br/><em>payable on Algorand.</em></h1>
    <div class="sub">The roaming gateway for AI agents · dual-chain receipts</div>
    <div class="chips">
      <span class="chip g">USDC on Algorand</span>
      <span class="chip">50 wrapped routes</span>
      <span class="chip">x402 v2</span>
    </div>
  </div>
  <div class="by">by <b>Agents-Trust</b> · settles via <b>GoPlausible</b> · #x402-global-challenge</div>
</body>
</html>
